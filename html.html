    :root {

    body {

    h2 {

    a{
        text-decoration: none;
      
        
    }

    .tab {
        padding-top: 15px;
        font-size: 25px;
        font-weight: 500;
        text-align: center;
        border-radius: 10px;
        background-color:var(--sec-color);
       
        width: 20%;
        height: 60px;
        cursor: pointer;
        transition: 0.4s ease-in-out;
        margin-left: 5%;
        margin-right: 5%;

        margin-top: 40px;
          font-weight: 800;
        
        
       
        

    }
           .tab a {
    color: var(--first-color);
    transition: 0.4s ease;
}


    .tab:hover {
        transform: scale(1.2);
         box-shadow: 0px 5px 15px  var(--sec-color);
        
       }

       .tab:hover a{
        color: white;
       }







   
    .break {
        width: 80%;
        margin: auto;
        opacity: 0.5;

    }




    /* media query */



     @media (min-width:768px) and (max-width:991px){

        .tab{
            width: 220px;
            
        }
        .tab a{
            font-size:22px;
        }    
        .break{
            margin-bottom: 10px;
        }

     }


      @media (max-width:767px){
         .tab{
            width: 300px;
         }
         
          .break{
            margin-top: -60px;
        }

      }

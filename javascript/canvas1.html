<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        background: #131313;
        color: whitesmoke;
        font-family: Helvetica, sans-serif;
        align-items: center;
    }

    .navbar {
        background: #292929;
        width: 800px;
        height: 80px;
        margin: 30px auto;
        box-shadow: 0px 3px 10px rgb(131, 129, 129);
        text-align: center;
        border-radius: 20px;

    }

    h2 {
        padding-top: 15px;
        font-size: 50px;
    }

    canvas {

        margin-left: 10%;
    }
</style>

<body>

    <header>
        <nav class="navbar">
            <h2>Canvas </h2>
        </nav>
    </header>
    <input type="color" id="mycolor" style="position: absolute;">
    <canvas id="mycan" style="background:rgb(0, 0, 0); width: 80%; height: 600;"></canvas>



    <script>
        var c = document.getElementById("mycan");
        var mycolor = document.getElementById("mycolor");


        var k;
        var r = 10
        var d = c.getContext("2d");
        c.height = window.innerHeight;
        c.width = window.innerWidth;
        var red, green, blue, drawmode
        var drawmode = false
        drawmode = "red"



        //document.title= "working"

        mycolor.onchange = function () {
            //alert(this.value)
            drawcolor = this.value
        }

        function f1(event) {

            // alert(event.keycode)
            k = event.key

            switch (k) {

                case "+":
                    if (r < 100) {
                        r = r + 1
                        document.title = "r"
                    }

                    break;

                case "-":
                    if (r > 10) {
                        r = r - 1
                        document.tittle = r
                    }
                    break;

                case " ":
                    d.clearRect(0, 0, window.innerHeight, window.innerWidth)
                    break;
            }


        }



        function draw(event) {
            if (drawmode) {
                var x = event.pageX
                var y = event.pageY

                red = Math.round(Math.random() * 255)
                green = Math.round(Math.random() * 255)
                blue = Math.round(Math.random() * 255)
                drawcolor = "rgb(" + red + ", " + green + ", " + blue + ")"
                //drawcolor="RED"

                d.beginPath();
                d.moveTo(x, y)
                d.lineTo(Math.random() * 1200, Math.random() * 1200);

                d.fillStyle =drawcolor
                d.fill()
                //d.lineWidth =Math.random()*110
                d.strokeStyle=drawcolor
                d.stroke();
            }
        }


        function f2()
        {
            drawmode = (!drawmode)?true:false
            document.tittle = drawmode
        }

        document.addEventListener("keydown",f1)
         document.addEventListener("click",f2)
           document.addEventListener("mousemove",draw)








    </script>


</body>

</html>

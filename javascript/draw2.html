<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<style>
* {
        margin: 0;
        padding: 0;
    }

    body {
        background: #131313;
        color:whitesmoke ;
        font-family: Helvetica, sans-serif;
        align-items: center;
    }

    .navbar {
        background: #292929;
        width: 800px;
        height: 80px;
        margin: 30px auto;
        box-shadow: 0px 3px 10px rgb(131, 129, 129);
        text-align: center;
        border-radius: 20px;

    }

    h2 {
        padding-top: 15px;
        font-size: 50px;
    }


    canvas{

        margin-left: 10%;
    }


</style>
<body>

     <header>
        <nav class="navbar">
            <h2>Canvas Draw</h2>
        </nav>
    </header>





    <canvas id="mycan" style="background:rgb(7, 7, 7); width: 80%; height: 600;" ></canvas>


    <script>
      var c = document.getElementById("mycan");
      var k;
      var r = 10
      var d = c.getContext("2d")
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      var red, green, blue, drawcolor
      var drawmode = false
      drawmode ="red"
      function pixel()
      {
        var x = Math.round(Math.random()*window.innerWidth)
         var y = Math.round(Math.random()*window.innerHeight)

         red = Math.round(Math.random()*255)
         green = Math.round(Math.random()*255)
         blue = Math.round(Math.random()*255)
         drawcolor ="rgb("+red+","+green+","+blue+")"
         d.beginPath();

         d.arc(x,y,Math.random()*27, 0, 3 *Math.PI);
         d.fillStyle = drawcolor

         d.fill()
         document.title = x

      }

      setInterval("pixel()",10)





    </script>
</body>
</html>

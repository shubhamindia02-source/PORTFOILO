<!DOCTYPE html>

<head>

<style>

    * {
        margin: 0;
        padding: 0;
    }





 body {
        background: #131313;
        color: whitesmoke;
        font-family: Helvetica, sans-serif;
        align-items: center;
    }

    .navbar {
        background: #292929;
        width: 800px;
        height: 80px;
        margin: 30px auto;
        box-shadow: 0px 3px 10px rgb(131, 129, 129);
        text-align: center;
        border-radius: 20px;

    }

    h2 {
        padding-top: 15px;

    }
    #nav{

        justify-content: space-evenly;

    #nav div{
            width: 230px;}
      


    #menu1,#menu2,#menu3{

        background-color: transparent;
        border-width: 0px;

    }
   

    #m,#m2, #m3{
      
        margin-top: 2px ;
        font-size: 30px;
        color: brown;
        padding: 0px;

    }
    li{
        list-style-type: none;
        padding: 10px;
        cursor: pointer;
        
    }
        li:hover{
        background-color: green;
        color: antiquewhite;
       
    }

    .toggle{
        display: none;

    }








</style>

<body>

            </div>

            <script>

                    m1.classList.add("toggle");

                    switch(mid)
                    {
                        case "menu1":
                            m.classList.remove("toggle");

                            break;

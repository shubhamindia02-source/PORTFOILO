<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>element tag</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        background: #131313;
        color:whitesmoke ;
        font-family: Helvetica, sans-serif;
        align-items: center;
    }

    .navbar {
        background: #292929;
        width: 800px;
        height: 80px;
        margin: 30px auto;
        box-shadow: 0px 3px 10px rgb(131, 129, 129);
        text-align: center;
        border-radius: 20px;

    }

    h2 {
        padding-top: 15px;
        font-size: 50px;
    }


</style>
<body>
     <header>
        <nav class="navbar">
            <h2>Create Element</h2>
        </nav>
    </header>
   
    <script>
        
     var p = document.createElement("img")
     document.body.appendChild(p)
     p.src="image/1.jpg"
     p.style="transition:0.50s; margin-left:40%; margin-top:70px; border-radius:10px; cursor:pointer; box-shadow:10px 10px 10px gray ; "
     document.title="no error"
     p.style.width="20%"


     p.onclick = function()
     {
        p.src="image/1.jpg"
        p.style.transform="scale(1)"
     }
     p.onmouseover=function()
     {
        this.style.transform="scale(1.30)"
     }
    

    </script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new portfolio</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        background: #131313;
        color: whitesmoke;
        font-family: Helvetica, sans-serif;
    }

    header {
        position: sticky;
        top: 0px;

    }

    nav {
        height: 7vh;
        background: #131313;


        display: flex;
        align-items: center;
        justify-content: space-around;


    }

    .leftnav {

        width: 40%;
        text-align: center;
        font-size: 25px;
    }

    .rightnav {

        width: 40%;
    }

    .rightnav ul {

        display: flex;
        justify-content: center;
    }

    nav ul li {
        list-style: none;
        margin-right: 30px;
        font-weight: bolder;
        font-size: 20px;
    }

    .rightnav ul li a {
        text-decoration: none;
        color: whitesmoke;
    }

    .rightnav ul li a:hover {

        color: #e64500;
    }

    .mainsection {
        align-items: center;
        display: flex;
        justify-content: space-around;
        margin: 110px;
        flex-wrap: wrap;
         

    }

    .profilepic img {
        width: 400px;
        height: 400px;
        border-radius: 50%;
        border: 8px solid #e64500;

    }

    .profilepic img:hover {

        border: 8px solid #ff9e75;
        transition: ease-in-out;

    }

    .rightsection {


        max-width: 30vw;
        margin-top: 70px;


    }


    span {
        background: #e64500;
        box-sizing: border-box;
        border-radius: 5px;

    }

    span:hover {
        background: none;
        color: #e64500;
        font-weight: bolder;

        transition: ease-in-out;
    }

    .hello {
        font-size: 30px;
        font-weight: normal;
    }

    .name {
        font-size: 50px;
        font-weight: 800;
    }

    .work {
        font-size: 30.5px;
        font-weight: 500;
        color: #e64500;
    }

    .work:hover {
        color: #ff9e75;

    }

    p {
        font-size: 20px;
    }



    .break {
        width: 80%;
        margin: auto;
        opacity: 0.5;

    }

    .navfooter {
          
        background: #252525;
        padding: 20px;
        text-align: center;
        margin-top: 60px;
        


    }

    .mywork {
        font-size: 23px;
        margin-bottom: 30px;
        opacity: 0.6;
    }

    .socialmedialink {
        margin: 20px;
    }

    .socialmedialink a {
        color: whitesmoke;
        margin: 15px;

        text-decoration: none;
        font-size: 23px;
        opacity: 0.6;


    }

    .socialmedialink a:hover {
        color: #e64500;
        opacity: 1;
    }

    .copyright {
        font-size: 23px;
        opacity: 0.5;

    }





      /* ── HAMBURGER MENU ── */
    .hamburger {
        display: none;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        padding: 8px;
        z-index: 100;
    }
    .hamburger span {
        display: block;
        width: 26px;
        height: 3px;
        background: whitesmoke;
        border-radius: 3px;
        transition: all 0.3s ease;
        box-sizing: unset;
    }
   

    /* ── TABLET (768px – 1024px) ── */
    @media (max-width: 1024px) and (min-width: 768px) {
        .mainsection {
            margin: 60px 40px;
            gap: 40px;
        }
        .profilepic img {
            width: 300px;
            height: 300px;
        }
        .rightsection {
            max-width: 45vw;
            margin-top: 30px;
        }
        .name {
            font-size: 38px;
        }
        .work {
            font-size: 22px;
        }
        .hello {
            font-size: 24px;
        }
        nav ul li {
            font-size: 16px;
            margin-right: 18px;
        }
        .leftnav {
            font-size: 20px;
        }
        .mywork {
            font-size: 18px;
        }
        .socialmedialink a {
            font-size: 18px;
        }
        .copyright {
            font-size: 16px;
        }
    }

    /* ── MOBILE (≤ 767px) ── */
    @media (max-width: 767px) {
        .hamburger {
            display: flex;
        }
        nav {
            height: auto;
            flex-wrap: wrap;
            padding: 10px 16px;
            justify-content: space-between;
            position: relative;
        }
        .leftnav {
            width: auto;
            font-size: 18px;
            text-align: left;
        }
        .rightnav {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
        }
        .rightnav.open {
            max-height: 300px;
            padding-bottom: 10px;
        }
        .rightnav ul {
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding-top: 14px;
        }
        nav ul li {
            font-size: 16px;
            margin-right: 0;
        }
        .mainsection {
            flex-direction: column;
            align-items: center;
            margin: 30px 20px;
            gap: 30px;
        }
        .profilepic img {
            width: 220px;
            height: 220px;
        }
        .rightsection {
            max-width: 100%;
            margin-top: 0;
            text-align: center;
        }
        .hello {
            font-size: 22px;
        }
        .name {
            font-size: 32px;
        }
        .work {
            font-size: 18px;
        }
        .navfooter {
            margin-top: 30px;
            padding: 16px;
        }
        .mywork {
            font-size: 14px;
            margin-bottom: 16px;
        }
        .socialmedialink a {
            font-size: 14px;
            margin: 8px;
        }
        .copyright {
            font-size: 13px;
        }
    }


      .hamburger.active span:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
        background: #e64500;
    }
    .hamburger.active span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
    }
    .hamburger.active span:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg);
        background: #e64500;
    }














</style>

<body>
    <header>
        <nav class="nav">
            <div class="leftnav">Shubham Portfolio</div>
             <div class="hamburger" id="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span></div>
            <div class="rightnav">
                <ul>
                    <li> <a href="index.html">Home</a></li>
                    <li> <a href="about.html">About</a></li>
                    <li> <a href="work.html">Work</a></li>
                    <li> <a href="contactme.html">Contact Me</a></li>
                </ul>
            </div>
        </nav>
        <hr>

    </header>
    <main>
        <section class="mainsection">
            <div class="leftsection">
                <DIV class="profilepic"><img src="image/PROFILE.JPG" alt="Profile photo"></DIV>
            </div>
            <div class="rightsection">
                <h3 class="hello"><span>Hello,</span>I am</h3>
                <h2 class="name">Shubham Arya</h2>
                <H2 class="work">UI/UX & WEB DESIGNER</H2>
                
            </div>


        </section>


    </main>
    <hr class="break">
    <footer>
        <div class="navfooter">
            <div class="mywork">UI/UX Designer | Web Designer | Graphic Designer | Video Editor</div>
            <div class="socialmedialink">
                <a href="https://www.linkedin.com/in/shubham-arya-3a2b3a266?utm_source=share_via&utm_content=profile&utm_medium=member_ios">LinkedIn</a>
                <a href="https://www.behance.net/shubhamarya24">Behance</a>
                <a href="https://www.instagram.com/shubham_arya98?igsh=Nm92cGw2eHJvcm4z">Instagram</a>
            </div>
            <div class="copyright"> © 2026 Shubham Arya. All rights reserved.</div>
        </div>


    </footer>


</body>

</html>

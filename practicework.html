<style>
     :root {
        --first-color: #000e25;
        --sec-color: rgb(7, 156, 255);
    }


    .mainsection {

        display: flex;
        justify-content: space-around;
        margin-top: 200px;
        flex-wrap: wrap;




    }

    .tab {
        width: 400px;
        height: 140px;
        border-radius: 10px;
        background-color: var(--sec-color);
        box-shadow: 0px 5px 10px #91868245;
        text-align: center;
        padding-top: 40px;
        font-size: 40px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.4s ease-in-out;

    }

    .tab a {
        text-decoration: none;
        color:var(--first-color);
        transition: 0.4s ease;

    }



    .tab:hover {
        transform: scale(1.2);
        color: white;
    
    }
     .tab:hover a{
         color: white;
     }



    /* media query */

    @media (min-width:768px) and (max-width:991px) {


        .tab {
            margin-top: 30px;
            padding-top: -200px;

        }

    }


    @media (max-width:767px){
        .tab{
            width: 300px;
            height: 100px;
            margin-top: 30px;
            padding-top: 30px;
            font-size: 30px;
        }
    }
</style>

                    <li><a href="#contact" class="menu-list">Contact</a></li>
                </ul>
            </div>
            <div class="toggle_btn">
                <img src="image/hamburger.png" alt="" class="ham-icon" id="bar">
            </div>
            <div class="dropdown_menu open" id="bar-div">
                <ul class="link" id="link-bar">
                    <li><a href="#home" class="menu-list">Home</a></li>
                    <li><a href="#about" class="menu-list">About</a></li>
                    <li><a href="#resume" class="menu-list">Resume</a></li>
                    <li><a href="#portfolio" class="menu-list">Work</a></li>
                    <li><a href="#contact" class="menu-list">Contact</a></li>

    <script>

        $(document).ready(function () {
            $("#bar").click(function () {
                $("#bar-div").toggle("fast")

            })


        })


    </script>


</body>
